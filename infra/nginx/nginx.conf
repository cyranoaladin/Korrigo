# Hide nginx version in Server header (security hardening)
server_tokens off;

# Docker DNS resolver for dynamic upstream resolution
# Prevents 502 errors when backend container IP changes
resolver 127.0.0.11 valid=10s ipv6=off;

# Determine X-Forwarded-Proto: use upstream proxy's value if present, else $scheme
# - Real prod behind TLS proxy: upstream sends X-Forwarded-Proto: https → passed through
# - Local-prod E2E (no TLS proxy): no header → falls back to $scheme (http)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Extract real client IP from host proxy (X-Real-IP header)
# Falls back to $binary_remote_addr when running without host proxy (local dev)
map $http_x_real_ip $rate_limit_key {
    default $http_x_real_ip;
    ''      $binary_remote_addr;
}

# PATCH-08: Zones de limitation de requêtes (BUG-12)
# Student login business rate limiting is enforced by Django per attempted
# identifier. This nginx limit is intentionally high and IP-based only as an
# anti-flood circuit breaker; it must not become the normal classroom/NAT limit.
limit_req_zone $rate_limit_key zone=student_login:10m rate=30r/s;
limit_req_zone $rate_limit_key zone=student_api:10m rate=100r/s;

server {
    listen 80;
    include /etc/nginx/mime.types;
    set $backend_upstream http://backend:8000;
    
    # Max upload size: 100MB is generous for batch PDF scans
    client_max_body_size 100M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (aligned with Django CSP — includes 'unsafe-inline' for Vue.js)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    
    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (Vite build: *.js, *.css with content hash) - cache forever
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add security headers (nginx inheritance broken by local add_header)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # index.html - never cache (must always fetch fresh to get new chunk references)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        # Re-add security headers (nginx inheritance broken by local add_header)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Backend Static Files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        # Re-add security headers (nginx inheritance broken by local add_header)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Backend Media Files — LOT 2: Protected via X-Accel-Redirect
    # Direct /media/ access is now blocked. All media requests go through
    # /api/media/<path> → Django auth check → X-Accel-Redirect → /internal-media/
    location /media/ {
        internal;
        alias /app/media/;
    }

    # Internal location used by X-Accel-Redirect from Django ProtectedMediaView
    # Allow same-origin iframe embedding (needed for student PDF viewer in ResultView)
    # All files here are already auth-protected by Django before X-Accel-Redirect
    location /internal-media/ {
        internal;
        alias /app/media/;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # PDF Final endpoint - Allow same-origin iframe embedding for student portal viewer
    location ~ ^/api/grading/copies/[^/]+/final-pdf/$ {
        proxy_pass $backend_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;

        # Strip ALL upstream headers that nginx will re-add with correct values
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Override server-level DENY with SAMEORIGIN for this PDF endpoint only
        # This allows the student portal to embed the PDF in an iframe
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Anti-flood guard for student login.
    # Business lockout is per attempted identifier in Django; this high IP burst
    # is kept only to absorb automated floods without blocking normal class use.
    location /api/students/login/ {
        limit_req zone=student_login burst=60 nodelay;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    # Rate limit spécifique pour l'API élève générale
    location /api/students/ {
        limit_req zone=student_api burst=200 nodelay;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    # Protected media endpoint — allow same-origin iframe embedding for PDF viewer
    # Requests go through Django auth → X-Accel-Redirect → /internal-media/
    location /api/media/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;

        # Strip ALL upstream security headers — nginx re-adds with correct values
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Allow same-origin iframe embedding (student PDF viewer)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API Proxy - Persistent connection upstream
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;

        # Prevent duplicate headers: Django also sets these via SecurityMiddleware.
        # Hide Django's copies; nginx adds them from server-level add_header.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Timeouts for long-running uploads (OCR batch processing can take 5+ minutes)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Prometheus endpoint must hit Django, not the SPA fallback.
    location = /metrics {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    # Frontend routes that start with /admin but are NOT Django admin
    # These must be served by the SPA (index.html)
    location ~ ^/admin/(login|users|settings|dashboard|exams|questionnaire|bilan) {
        try_files $uri $uri/ /index.html;
    }

    # Django Admin Proxy - All other /admin/* routes go to Django
    location /admin/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;

        # Prevent duplicate headers from Django
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Frontend (SPA) - Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
