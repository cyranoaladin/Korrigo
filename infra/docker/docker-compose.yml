version: '3.8'

# Development Docker Compose (SQLite fallback for local simulation)
# Usage: docker compose up -d

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../../backend
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../backend:/app
      - ../../scan_DNB_maths:/scan_DNB_maths
      - media_data:/app/media
    ports:
      - "8088:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # DATABASE_URL: removed for SQLite fallback
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "true"
      SSL_ENABLED: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1,korrigo.labomaths.tn,backend"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173"
      CORS_ALLOWED_ORIGINS: "http://localhost:8088,http://localhost:5173"
      REDIS_HOST: redis

  frontend:
    build:
      context: ../../frontend
      target: development
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_API_URL: /api

  celery:
    build: ../../backend
    command: celery -A core worker -l info --concurrency=2 --max-tasks-per-child=50
    volumes:
      - ../../backend:/app
      - ../../scan_DNB_maths:/scan_DNB_maths
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # DATABASE_URL: removed for SQLite fallback
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "true"
      REDIS_HOST: redis

volumes:
  media_data:
