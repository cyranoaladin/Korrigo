# Korrigo production compose.
#
# Canonical runtime file for Step 3.
# - Images are pinned by immutable GHCR digest.
# - No overlay or host frontend bind mount is used.
# - Project name is fixed to keep existing Korrigo container/volume names
#   such as docker-db-1 and docker_media_volume.

name: docker

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?err}"
      POSTGRES_USER: "${POSTGRES_USER:?err}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?err}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?err} -d ${POSTGRES_DB:?err}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      sh -c "exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
      --requirepass $$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?err}"
    healthcheck:
      test: >-
        sh -c "redis-cli -a $$REDIS_PASSWORD ping"
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/cyranoaladin/korrigo-backend@sha256:a8bb49dd22b00238160e1ccec26732de89d2ac8cbc13526e1131e5793a5ae893
    restart: unless-stopped
    command: gunicorn core.wsgi:application -c gunicorn_config.py
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/backups
      - ocr_cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DJANGO_ENV: production
      DEBUG: "False"
      SSL_ENABLED: "${SSL_ENABLED:-True}"
      DJANGO_AUTO_MIGRATE: "false"
      SEED_ON_START: "false"
      ENABLE_API_DOCS: "false"
      SECRET_KEY: "${SECRET_KEY:?err}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?err}"
      DJANGO_ALLOWED_HOSTS: "${ALLOWED_HOSTS:?err}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:?err}"
      DB_NAME: "${POSTGRES_DB:?err}"
      DB_USER: "${POSTGRES_USER:?err}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?err}"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?err}"
      REDIS_DB: "${REDIS_DB:-1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?err}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?err}"
      METRICS_TOKEN: "${METRICS_TOKEN:?err}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      GUNICORN_FORWARDED_IPS: "${GUNICORN_FORWARDED_IPS:-*}"
      BACKUP_DIR: "/app/backups"
      BACKUP_GPG_PASSPHRASE: "${BACKUP_GPG_PASSPHRASE:?err}"
      REQUIRE_BACKUP_GPG: "true"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      AI_PROVIDER_URL: "${AI_PROVIDER_URL:-}"
      AI_PROVIDER_KEY: "${AI_PROVIDER_KEY:-}"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-}"
      BILAN_LLM_DEFAULT: "${BILAN_LLM_DEFAULT:-}"
      BILAN_LLM_PREMIUM: "${BILAN_LLM_PREMIUM:-}"
      BILAN_REQUIRE_RAG: "${BILAN_REQUIRE_RAG:-}"
      BILAN_ALLOW_OLLAMA_FALLBACK: "${BILAN_ALLOW_OLLAMA_FALLBACK:-}"
      BILAN_OLLAMA_MODEL: "${BILAN_OLLAMA_MODEL:-}"
      RAG_URL: "${RAG_URL:-}"
      RAG_TOKEN: "${RAG_TOKEN:-}"
      DEFAULT_PASSWORD: "${DEFAULT_PASSWORD:?err}"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      XDG_CACHE_HOME: "/app/.cache"
      EASYOCR_MODULE_PATH: "/app/.cache/easyocr"
      TORCH_HOME: "/app/.cache/torch"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  celery:
    image: ghcr.io/cyranoaladin/korrigo-backend@sha256:a8bb49dd22b00238160e1ccec26732de89d2ac8cbc13526e1131e5793a5ae893
    restart: unless-stopped
    command: celery -A core worker -l info --concurrency=4 --max-tasks-per-child=100
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
      - ocr_cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DJANGO_ENV: production
      DEBUG: "False"
      SSL_ENABLED: "${SSL_ENABLED:-True}"
      DJANGO_AUTO_MIGRATE: "false"
      SEED_ON_START: "false"
      ENABLE_API_DOCS: "false"
      SECRET_KEY: "${SECRET_KEY:?err}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?err}"
      DJANGO_ALLOWED_HOSTS: "${ALLOWED_HOSTS:?err}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:?err}"
      DB_NAME: "${POSTGRES_DB:?err}"
      DB_USER: "${POSTGRES_USER:?err}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?err}"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?err}"
      REDIS_DB: "${REDIS_DB:-1}"
      BACKUP_DIR: "/app/backups"
      BACKUP_GPG_PASSPHRASE: "${BACKUP_GPG_PASSPHRASE:?err}"
      REQUIRE_BACKUP_GPG: "true"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      AI_PROVIDER_URL: "${AI_PROVIDER_URL:-}"
      AI_PROVIDER_KEY: "${AI_PROVIDER_KEY:-}"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-}"
      BILAN_LLM_DEFAULT: "${BILAN_LLM_DEFAULT:-}"
      BILAN_LLM_PREMIUM: "${BILAN_LLM_PREMIUM:-}"
      BILAN_REQUIRE_RAG: "${BILAN_REQUIRE_RAG:-}"
      BILAN_ALLOW_OLLAMA_FALLBACK: "${BILAN_ALLOW_OLLAMA_FALLBACK:-}"
      BILAN_OLLAMA_MODEL: "${BILAN_OLLAMA_MODEL:-}"
      RAG_URL: "${RAG_URL:-}"
      RAG_TOKEN: "${RAG_TOKEN:-}"
      DEFAULT_PASSWORD: "${DEFAULT_PASSWORD:?err}"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      XDG_CACHE_HOME: "/app/.cache"
      EASYOCR_MODULE_PATH: "/app/.cache/easyocr"
      TORCH_HOME: "/app/.cache/torch"
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    image: ghcr.io/cyranoaladin/korrigo-backend@sha256:a8bb49dd22b00238160e1ccec26732de89d2ac8cbc13526e1131e5793a5ae893
    restart: unless-stopped
    command: celery -A core beat -l info
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
      - ocr_cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DJANGO_ENV: production
      DEBUG: "False"
      SSL_ENABLED: "${SSL_ENABLED:-True}"
      DJANGO_AUTO_MIGRATE: "false"
      SEED_ON_START: "false"
      ENABLE_API_DOCS: "false"
      SECRET_KEY: "${SECRET_KEY:?err}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?err}"
      DJANGO_ALLOWED_HOSTS: "${ALLOWED_HOSTS:?err}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:?err}"
      DB_NAME: "${POSTGRES_DB:?err}"
      DB_USER: "${POSTGRES_USER:?err}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?err}"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?err}"
      REDIS_DB: "${REDIS_DB:-1}"
      BACKUP_DIR: "/app/backups"
      BACKUP_GPG_PASSPHRASE: "${BACKUP_GPG_PASSPHRASE:?err}"
      REQUIRE_BACKUP_GPG: "true"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      AI_PROVIDER_URL: "${AI_PROVIDER_URL:-}"
      AI_PROVIDER_KEY: "${AI_PROVIDER_KEY:-}"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-}"
      BILAN_LLM_DEFAULT: "${BILAN_LLM_DEFAULT:-}"
      BILAN_LLM_PREMIUM: "${BILAN_LLM_PREMIUM:-}"
      BILAN_REQUIRE_RAG: "${BILAN_REQUIRE_RAG:-}"
      BILAN_ALLOW_OLLAMA_FALLBACK: "${BILAN_ALLOW_OLLAMA_FALLBACK:-}"
      BILAN_OLLAMA_MODEL: "${BILAN_OLLAMA_MODEL:-}"
      RAG_URL: "${RAG_URL:-}"
      RAG_TOKEN: "${RAG_TOKEN:-}"
      DEFAULT_PASSWORD: "${DEFAULT_PASSWORD:?err}"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      XDG_CACHE_HOME: "/app/.cache"
      EASYOCR_MODULE_PATH: "/app/.cache/easyocr"
      TORCH_HOME: "/app/.cache/torch"
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'celery -A core beat'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: ghcr.io/cyranoaladin/korrigo-nginx@sha256:ecf71a4ed705ab3cb72121edc27030294a8d81eceeb2635a8e2beb45e84bf8a4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  media_volume:
  backup_volume:
  ocr_cache:
