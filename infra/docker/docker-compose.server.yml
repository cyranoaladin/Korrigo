# Server override for korrigo.labomaths.tn
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.server.yml up -d
# Reads production values from infra/docker/.env (Docker Compose project .env)

# ── Shared env vars (P2-1 audit fix: was duplicated × 3) ──────────────────────
x-common-env: &common-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  DJANGO_ENV: ${DJANGO_ENV:-production}
  DEBUG: ${DEBUG:-False}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # NOTE: OpenAI SDK reads OPENAI_BASE_URL even if it is set to an empty string.
  # If empty, it breaks requests (missing http/https). Default to the official API.
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
  AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
  AI_PROVIDER_KEY: ${AI_PROVIDER_KEY:-}
  AI_MODEL_NAME: ${AI_MODEL_NAME:-}
  # Bilan
  BILAN_LLM_DEFAULT: ${BILAN_LLM_DEFAULT:-}
  BILAN_LLM_PREMIUM: ${BILAN_LLM_PREMIUM:-}
  BILAN_REQUIRE_RAG: ${BILAN_REQUIRE_RAG:-}
  BILAN_ALLOW_OLLAMA_FALLBACK: ${BILAN_ALLOW_OLLAMA_FALLBACK:-}
  BILAN_OLLAMA_MODEL: ${BILAN_OLLAMA_MODEL:-}
  RAG_URL: ${RAG_URL:-http://ingestor:8001}
  RAG_TOKEN: ${RAG_TOKEN:-}

services:
  backend:
    ports: !override
      - "8000"
    networks:
      - default
      - rag_ui_net
    environment:
      <<: *common-env
      SSL_ENABLED: ${SSL_ENABLED:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-korrigo.labomaths.tn,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://korrigo.labomaths.tn}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://korrigo.labomaths.tn}
      METRICS_TOKEN: ${METRICS_TOKEN:-}

  celery:
    networks:
      - default
      - rag_ui_net
    environment:
      <<: *common-env

  celery-beat:
    networks:
      - default
      - rag_ui_net
    environment:
      <<: *common-env

networks:
  rag_ui_net:
    external: true
    name: ${RAG_DOCKER_NETWORK:-compose_rag_ui_net}
