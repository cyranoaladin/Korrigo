name: Production Deploy Disabled (Korrigo)

# Production deployments are intentionally not automated from GitHub Actions.
# Use the controlled runbook instead: fresh backup, migrate --plan, explicit
# one-shot migrations, service health checks, and no automatic seed.

on:
  workflow_dispatch:

jobs:
  runbook-only:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment is runbook-controlled
        run: |
          echo "Automatic production deployment is disabled."
          echo "Use the Korrigo controlled deployment runbook."
