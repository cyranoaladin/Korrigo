name: CI + Deploy (Korrigo)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      reset_db:
        description: 'Reset PostgreSQL volume (DESTROYS ALL DATA)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-korrigo
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/korrigo

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # --- Frontend CI ---
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # --- Backend CI ---
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Backend deps
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Backend tests
        working-directory: backend
        run: venv/bin/pytest -q

  build_and_push:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build & push nginx (frontend) image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-nginx:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    environment: production
    steps:
      - name: Check deploy prerequisites
        id: prereq
        shell: bash
        env:
          _VPS_HOST: ${{ secrets.VPS_HOST }}
          _VPS_USER: ${{ secrets.VPS_USER }}
          _VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          _VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          missing=""
          [ -n "$_VPS_HOST" ]   || missing="$missing VPS_HOST"
          [ -n "$_VPS_USER" ]   || missing="$missing VPS_USER"
          [ -n "$_VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$_VPS_PATH" ]   || missing="$missing VPS_PATH"
          if [ -n "$missing" ]; then
            echo "::warning::Deploy secrets not configured — deployment skipped. Missing:$missing"
            echo "  ➡️  Configure in: Settings > Environments > production > Secrets"
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All deploy secrets configured"
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        if: steps.prereq.outputs.deploy_ready == 'true'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add Known Hosts
        if: steps.prereq.outputs.deploy_ready == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: SSH Diagnostics (Safe)
        if: steps.prereq.outputs.deploy_ready == 'true'
        run: |
          ssh -V
          ls -la ~/.ssh
          # Check connectivity without running commands
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "uptime" || echo "Test connection failed (expected if keys not set yet)"

      - name: Checkout code
        if: steps.prereq.outputs.deploy_ready == 'true'
        uses: actions/checkout@v3

      - name: Sync compose files to VPS
        if: steps.prereq.outputs.deploy_ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          
          echo "📂 Creating directory structure on VPS..."
          # Create infra directory structure on VPS if not exists
          ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p ${VPS_PATH:?VPS_PATH not set}/infra/docker ${VPS_PATH}/infra/nginx"

          echo "📤 Syncing docker-compose.prod.yml..."
          # Sync compose file
          scp -o StrictHostKeyChecking=yes \
            infra/docker/docker-compose.prod.yml \
            "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/infra/docker/"

          echo "📤 Syncing nginx configuration..."
          # Sync nginx config
          scp -o StrictHostKeyChecking=yes -r \
            infra/nginx/ \
            "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/infra/"
          
          echo "✅ Sync complete"

      - name: Update deploy SHA in VPS .env
        if: steps.prereq.outputs.deploy_ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          KORRIGO_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "📝 Updating KORRIGO_SHA in server .env (preserving all other values)..."
          ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" bash -c "'
            set -euo pipefail
            ENV_FILE=\"${VPS_PATH}/.env\"
            test -f \"\${ENV_FILE}\" || { echo \"❌ .env not found at \${ENV_FILE} — server must have a pre-existing .env\"; exit 1; }
            if grep -q \"^KORRIGO_SHA=\" \"\${ENV_FILE}\"; then
              sed -i \"s|^KORRIGO_SHA=.*|KORRIGO_SHA=${KORRIGO_SHA}|\" \"\${ENV_FILE}\"
            else
              echo \"KORRIGO_SHA=${KORRIGO_SHA}\" >> \"\${ENV_FILE}\"
            fi
            echo \"  ✅ KORRIGO_SHA updated to ${KORRIGO_SHA}\"
          '"

      - name: Deploy
        if: steps.prereq.outputs.deploy_ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          KORRIGO_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RESET_DB: ${{ inputs.reset_db || 'false' }}
        run: |
          ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" bash <<EOSSH
            set -euo pipefail
            
            # Export environment variables passed from GitHub Actions runner
            export VPS_PATH="${VPS_PATH}"
            export KORRIGO_SHA="${KORRIGO_SHA}"
            export GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}"
            export GHCR_USER="${GHCR_USER}"
            export GHCR_PAT="${GHCR_PAT}"
            export RESET_DB="${RESET_DB}"
            
            # Verify they were passed correctly
            test -n "\${VPS_PATH}" || { echo "❌ VPS_PATH empty after export"; exit 1; }
            test -n "\${KORRIGO_SHA}" || { echo "❌ KORRIGO_SHA empty after export"; exit 1; }
            
            # ═══════════════════════════════════════
            # PRE-FLIGHT CHECKS
            # ═══════════════════════════════════════
            echo "🔍 Pre-flight checks..."
            echo "  User: \$(whoami)"
            echo "  Host: \$(hostname)"
            echo "  PWD: \$(pwd)"
            
            # Defensive cd with explicit error
            echo "📂 Changing to deployment directory..."
            cd "\${VPS_PATH}" || { echo "❌ Failed to cd to \${VPS_PATH}"; exit 1; }
            echo "  ✅ Now in: \$(pwd)"
            
            # Verify directory structure
            echo "📁 Verifying directory structure..."
            ls -la infra/ || { echo "❌ infra/ directory missing"; exit 1; }
            ls -la infra/docker/ || { echo "❌ infra/docker/ directory missing"; exit 1; }
            
            # Verify compose file exists
            echo "📄 Verifying docker-compose.prod.yml..."
            test -f infra/docker/docker-compose.prod.yml || { 
              echo "❌ infra/docker/docker-compose.prod.yml not found"
              ls -la infra/docker/
              exit 1
            }
            echo "  ✅ docker-compose.prod.yml found"
            
            # Verify Docker installation
            echo "🐳 Verifying Docker..."
            docker --version || { echo "❌ Docker not installed"; exit 1; }
            docker compose version || { echo "❌ Docker Compose not available"; exit 1; }
            
            # ═══════════════════════════════════════
            # GHCR LOGIN
            # ═══════════════════════════════════════
            echo "🔐 Logging in to GitHub Container Registry..."
            if [ -n "\${GHCR_PAT:-}" ] && [ -n "\${GHCR_USER:-}" ]; then
              echo "\${GHCR_PAT}" | docker login ghcr.io -u "\${GHCR_USER}" --password-stdin || {
                echo "⚠️  GHCR login failed — continuing with anonymous pull (public images)"
              }
            else
              echo "  ℹ️  GHCR credentials not set — using anonymous pull (public images)"
            fi
            
            # ═══════════════════════════════════════
            # DEPLOYMENT — GARDE-FOUS
            # ═══════════════════════════════════════
            echo "🛡️ Pre-deployment safety checks..."
            
            # 1. Verify .env exists
            test -f .env || { echo "❌ .env file missing on server — deploy aborted"; exit 1; }
            echo "  ✅ .env file found"
            
            # 2. Verify critical variables are present in .env
            MISSING_VARS=""
            for VAR in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD SECRET_KEY ALLOWED_HOSTS KORRIGO_SHA; do
              grep -q "^\${VAR}=" .env || MISSING_VARS="\${MISSING_VARS} \${VAR}"
            done
            if [ -n "\${MISSING_VARS}" ]; then
              echo "❌ .env is missing critical variables:\${MISSING_VARS}"
              echo "  Server .env must be configured manually before CI deploy."
              exit 1
            fi
            echo "  ✅ All critical .env variables present"
            
            # 3. Verify DB is reachable with current .env credentials
            echo "🔌 Testing DB connectivity..."
            set -a; source .env; set +a
            docker compose --env-file .env -f infra/docker/docker-compose.prod.yml exec -T db \
              pg_isready -U "\${POSTGRES_USER}" -d "\${POSTGRES_DB}" || {
              echo "❌ DB not reachable — deploy aborted before any destructive action"
              exit 1
            }
            echo "  ✅ DB connectivity confirmed"
            
            # ═══════════════════════════════════════
            # DEPLOYMENT
            # ═══════════════════════════════════════
            # Optional: reset DB volume if requested via workflow_dispatch
            if [ "${RESET_DB}" = "true" ]; then
              echo "⚠️  RESET_DB requested — destroying all containers and volumes..."
              docker compose --env-file .env -f infra/docker/docker-compose.prod.yml down -v 2>/dev/null || true
              echo "  ✅ Volumes destroyed"
            fi
            
            echo "📥 Pulling latest images (SHA: \${KORRIGO_SHA})..."
            docker compose --env-file .env -f infra/docker/docker-compose.prod.yml pull || {
              echo "❌ Failed to pull images"
              exit 1
            }
            echo "  ✅ Images pulled"
            
            echo "🔄 Running database migrations..."
            docker compose --env-file .env -f infra/docker/docker-compose.prod.yml run --rm -T backend python manage.py migrate < /dev/null || {
              echo "❌ Migrations failed"
              exit 1
            }
            echo "  ✅ Migrations complete"
            
            echo "🌱 Seeding production data (idempotent)..."
            docker compose --env-file .env -f infra/docker/docker-compose.prod.yml run --rm -T backend python seed_prod.py < /dev/null || {
              echo "❌ Seeding failed"
              exit 1
            }
            echo "  ✅ Seeding complete"
            
            echo "📦 Collecting static files..."
            docker compose --env-file .env -f infra/docker/docker-compose.prod.yml run --rm -T backend python manage.py collectstatic --noinput < /dev/null || {
              echo "❌ Collectstatic failed"
              exit 1
            }
            echo "  ✅ Static files collected"
            
            echo "🚀 Starting containers..."
            docker compose --env-file .env -f infra/docker/docker-compose.prod.yml up -d --wait --wait-timeout 180 || {
              echo "❌ Failed to start containers"
              docker compose --env-file .env -f infra/docker/docker-compose.prod.yml ps
              echo "Backend logs:"
              docker compose --env-file .env -f infra/docker/docker-compose.prod.yml logs --tail=50 backend
              exit 1
            }
            echo "  ✅ Containers started"
            
            # ═══════════════════════════════════════
            # HEALTH CHECK
            # ═══════════════════════════════════════
            echo "🏥 Running health check..."
            sleep 5
            if ! curl -sf --max-time 10 http://127.0.0.1:8088/api/health/ >/dev/null; then
              echo "❌ Health check failed"
              echo "Container status:"
              docker compose --env-file .env -f infra/docker/docker-compose.prod.yml ps
              echo "Backend logs:"
              docker compose --env-file .env -f infra/docker/docker-compose.prod.yml logs --tail=30 backend
              exit 1
            fi
            echo "  ✅ Health check passed"
            
            # ═══════════════════════════════════════
            # SUCCESS
            # ═══════════════════════════════════════
            echo ""
            echo "╔════════════════════════════════════════╗"
            echo "║  ✅ DEPLOY OK: \${KORRIGO_SHA:0:8}         ║"
            echo "╚════════════════════════════════════════╝"
          EOSSH
